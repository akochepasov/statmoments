[project]
name = "statmoments"
dynamic = ["version", "dependencies"]
description = "Fast streaming single-pass univariate/bivariate statistics and t-test"
requires-python = ">=3.10"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Anton Kochepasov", email = "akss@me.com"}
]
keywords = [
    "data-science",
    "univariate",
    "bivariate",
    "skewness",
    "kurtosis",
    "coskewness",
    "cokurtosis",
    "statistics",
    "streaming",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

# scipy is a build requirement because _native.pxd cimports scipy.linalg.cython_blas.
# The upper bound keeps the manylinux2014 build container on binary scipy wheels.
[build-system]
requires = [
    "setuptools>=77",
    "Cython>=3.0.10,<4",
    "numpy>=1.22.0,<2",
    "scipy>=1.8,<1.17",
]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
]

gpu = [
    "cupy-cuda12x",
    "nvmath-python"
]

# Development dependencies
dev = [
    "statmoments[test]",
    "statmoments[gpu]",
    "Cython>=3.0.10,<4",
    "setuptools>=77",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/akochepasov/statmoments"
Documentation = "https://github.com/akochepasov/statmoments#readme"
"Source Code" = "https://github.com/akochepasov/statmoments"
"Issue Tracker" = "https://github.com/akochepasov/statmoments/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["statmoments*"]

[tool.setuptools.dynamic]
version = {attr = "statmoments._version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
statmoments = ["*.pyx", "*.pxd", "*.pyxbld", "GIT_VERSION.txt"]

# Tool configurations

[tool.pytest.ini_options]
testpaths = ["statmoments/tests"]
python_files = ["test_*.py"]
addopts = "-v"
# To run with coverage: pytest --cov=statmoments --cov-report=term-missing

[tool.coverage.run]
branch = true
relative_files = true
source = ["statmoments"]
omit = [
    "*/tests/*",
    "*/benchmark/*",
    "*/examples/*",
    "statmoments/_native.pyx",
    "statmoments/_version.py",
]

[tool.coverage.paths]
source = [
    "statmoments",
    "*/site-packages/statmoments",
    "*\\site-packages\\statmoments",
]

[tool.coverage.report]
fail_under = 40
precision = 2
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# Wheel builds (CI: cibuildwheel on Linux and Windows)
# Other platforms install from the sdist
[tool.cibuildwheel]
build = ["cp310-*", "cp312-*"]
skip = ["*-musllinux_*"]
build-verbosity = 1
test-command = "python -c \"import statmoments, statmoments.univar as uv; uv.Univar(4, 2, moment=2)\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux2014"
# Use compatible wheels; newer source releases may need newer build tools.
before-test = "python -m pip install --only-binary=:all: -r '{package}/requirements.txt'"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
