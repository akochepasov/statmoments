name: Building Python Package

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install lint dependencies
        run: pip install --no-cache-dir flake8

      - name: Lint with flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 --count --select=E9,F63,F7,F82 --show-source --statistics .
          # exit-zero treats all errors as warnings
          flake8 --count --exit-zero --max-line-length=120 --max-complexity=10 --statistics .

  # Source distribution: the install path for every platform without a prebuilt wheel
  build-sdist:
    name: Build sdist
    needs: lint
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist
          twine check --strict dist/*

      - name: Upload sdist
        uses: actions/upload-artifact@v5
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          retention-days: 14

  # Compile from the sdist on a clean interpreter, as pip does on platforms without wheels.
  # Linux wheels are fully tested below, so Linux only checks that the sdist builds and imports.
  test-sdist:
    name: sdist ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build-sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python-version: '3.10', full-tests: false }
          - { os: macos-15,     python-version: '3.12', full-tests: true }
    defaults:
      run:
        shell: bash
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download sdist
        uses: actions/download-artifact@v5
        with:
          name: dist-sdist
          path: dist

      - name: Install from sdist (compiles Cython during install)
        run: |
          python -m pip install --upgrade pip
          pip install "$(ls dist/*.tar.gz)[test]"

      - name: Smoke test installed package
        if: ${{ !matrix.full-tests }}
        run: |
          cd "${RUNNER_TEMP}"
          python -c "import statmoments, statmoments.univar as uv; uv.Univar(4, 2, moment=2)"

      - name: Run tests on installed package
        if: ${{ matrix.full-tests }}
        run: |
          mkdir -p "${RUNNER_TEMP}/sdist-test"
          cd "${RUNNER_TEMP}/sdist-test"
          python -m pytest -n auto --dist loadfile --pyargs statmoments.tests

  # Wheels: one cibuildwheel run per OS builds every Python listed in pyproject.toml
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        with:
          output-dir: wheelhouse

      - name: Check wheel metadata
        shell: bash
        run: |
          python -m pip install twine
          twine check --strict wheelhouse/*.whl

      - name: Upload wheels
        uses: actions/upload-artifact@v5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          retention-days: 14

  # Install the built wheel on a clean interpreter and run the full test suite against it.
  # The cp310 wheels are covered by test-min-deps.
  test-wheels:
    name: Test wheel ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python-version: ['3.12']
    defaults:
      run:
        shell: bash
    steps:
      # Needed for coverage config and path mapping only; the package comes from the wheel
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          # Install the local wheel only (never a PyPI release), then its dependencies
          pip install --no-index --find-links dist --no-deps statmoments
          pip install "statmoments[test]"

      - name: Run tests on installed wheel
        run: |
          test_dir="${RUNNER_TEMP}/wheel-test"
          mkdir -p "$test_dir"
          cd "$test_dir"
          cov_config="${GITHUB_WORKSPACE}/pyproject.toml"
          cov_xml="${GITHUB_WORKSPACE}/coverage-${{ runner.os }}.xml"
          python -m pytest --durations=0 -n auto --dist loadfile --cov=statmoments --cov-config "$cov_config" --cov-report "xml:$cov_xml" --pyargs statmoments.tests
          coverage report --rcfile "$cov_config" -m

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ runner.os == 'Windows' && 'unittests' || 'linux' }}
          fail_ci_if_error: true
          files: ./coverage-${{ runner.os }}.xml

  # Oldest supported dependencies on the oldest Python, derived from the floors in requirements.txt
  test-min-deps:
    name: Test minimum dependencies on ${{ matrix.os }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Download wheels
        uses: actions/download-artifact@v5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: dist

      - name: Install wheel with minimum dependency versions
        run: |
          python -m pip install --upgrade pip
          sed -E 's/>=([0-9.]+).*/==\1/' requirements.txt > requirements-min.txt
          cat requirements-min.txt
          pip install --no-index --find-links dist --no-deps statmoments
          pip install --only-binary=:all: -r requirements-min.txt pytest pytest-xdist
          pip check

      - name: Run tests on installed wheel
        run: |
          test_dir="${RUNNER_TEMP}/min-deps-test"
          mkdir -p "$test_dir"
          cd "$test_dir"
          python -m pytest -n auto --dist loadfile --pyargs statmoments.tests
